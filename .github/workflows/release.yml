name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuget:
    runs-on: ${{ fromJSON(vars.NEXA_PUBLIC_SELF_HOSTED_RUNNER_ENABLED == 'true' && github.repository == 'NexA-LLC/reown-dotnet' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["self-hosted","macOS","ARM64","buildchan"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create isolated .NET directories
        run: |
          dotnet_state="$(mktemp -d "$RUNNER_TEMP/reown-dotnet.XXXXXX")"
          echo "DOTNET_INSTALL_DIR=$dotnet_state/sdk" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_HOME=$dotnet_state/home" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$dotnet_state/packages" >> "$GITHUB_ENV"
          echo "NUGET_HTTP_CACHE_PATH=$dotnet_state/http-cache" >> "$GITHUB_ENV"
          echo "NUGET_PLUGINS_CACHE_PATH=$dotnet_state/plugins-cache" >> "$GITHUB_ENV"
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Install dotnet-script
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/reown-dotnet-tools-${{ github.job }}" dotnet-script
          echo "$RUNNER_TEMP/reown-dotnet-tools-${{ github.job }}" >> "$GITHUB_PATH"

      - name: Build Release
        run: dotnet build Reown.NoUnity.slnf -c Release --restore

      - name: Pack nugets
        run: dotnet pack Reown.NoUnity.slnf -c Release --no-build --output .

      - name: Push to NuGet
        run: dotnet nuget push "*.nupkg" --api-key ${{secrets.nuget_api_key}} --source https://api.nuget.org/v3/index.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/bin/**/*.dll
            !**/test/**/bin/**/*.dll

  unity:
    runs-on: ${{ fromJSON(vars.NEXA_PUBLIC_SELF_HOSTED_RUNNER_ENABLED == 'true' && github.repository == 'NexA-LLC/reown-dotnet' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["self-hosted","macOS","ARM64","buildchan"]' || '["ubuntu-latest"]') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create isolated .NET directories
        run: |
          dotnet_state="$(mktemp -d "$RUNNER_TEMP/reown-dotnet.XXXXXX")"
          echo "DOTNET_INSTALL_DIR=$dotnet_state/sdk" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_HOME=$dotnet_state/home" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$dotnet_state/packages" >> "$GITHUB_ENV"
          echo "NUGET_HTTP_CACHE_PATH=$dotnet_state/http-cache" >> "$GITHUB_ENV"
          echo "NUGET_PLUGINS_CACHE_PATH=$dotnet_state/plugins-cache" >> "$GITHUB_ENV"
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Install dotnet-script
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/reown-dotnet-tools-${{ github.job }}" dotnet-script
          echo "$RUNNER_TEMP/reown-dotnet-tools-${{ github.job }}" >> "$GITHUB_PATH"

      - name: Configure Git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Create git tags
        run: |
          set -e
          VERSION=$(dotnet-script ./.github/scripts/get-version.csx)
          if [ -z "$VERSION" ]; then
            echo "Error: Version script returned empty value"
            exit 1
          fi
          echo "Creating tags for version $VERSION"
          
          dotnet-script ./.github/scripts/get-unity-package-names.csx | while read -r package; do
            TAG="$package/$VERSION"
            echo "Creating tag $TAG"
            git tag -a "$TAG" -m "Release $package version $VERSION"
          done

      - name: Push tags
        run: git push origin --tags
